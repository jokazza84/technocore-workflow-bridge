[build-system]
requires = ["setuptools==68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-workflow-bridge"
version = "0.2.0"
description = "Bounded read-only Technocore JSONL bridge for agentic coding workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX",
]

[project.scripts]
technocore-workflow-bridge = "technocore_workflow_bridge.cli:main"
technocore-workflow-consumer = "technocore_workflow_bridge.consumer_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
technocore_workflow_bridge = ["schemas/*.json"]
