name: offline-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Run offline unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s tests -v
      - name: Build twice and compare byte-for-byte
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B tools/build_reproducible.py --project . --out dist
      - name: Verify members, modes, timestamps, hashes and RECORD
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B tools/verify_distributions.py --project . dist
      - name: Test the sdist and wheel without installation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B tools/test_distributions.py dist
